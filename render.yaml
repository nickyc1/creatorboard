services:
  - type: web
    name: creatorboard-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/session
    envVars:
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_ALLOWED_EMAILS
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        sync: false
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: AUTH_EMAIL_FROM
        value: CreatorBoard <login@creatorboard.io>
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: INSTAGRAM_GRAPH_BASE
        value: https://graph.instagram.com
      - key: META_IG_ACCOUNT_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
