services:
  - type: web
    name: creatorboard-app
    runtime: node
    buildCommand: corepack pnpm install --frozen-lockfile && corepack pnpm build
    startCommand: corepack pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.21.1
      - key: AUTH_REQUIRED
        value: "true"
      - key: AUTH_COOKIE_SECRET
        generateValue: true
      - key: AUTH_EMAIL_FROM
        value: CreatorBoard <login@creatorboard.io>
      - key: META_GRAPH_VERSION
        value: v25.0
      - key: INSTAGRAM_GRAPH_BASE
        value: https://graph.instagram.com
